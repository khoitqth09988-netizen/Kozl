<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kozl Music</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --text: #f5f5f7;
            --muted: #888;
            --border: #262626;
            --hover: #1f1f1f;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 600px; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { font-size: 26px; font-weight: 600; margin: 0 0 6px; }
        p { color: var(--muted); font-size: 13px; margin: 0; }
        
        .search-box { position: relative; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: 0.2s;
        }
        input:focus { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.08); }
        svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: var(--muted); }

        .playlist { display: flex; flex-direction: column; gap: 10px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: background 0.2s;
        }
        .card:hover { background: var(--hover); }
        .info { display: flex; justify-content: space-between; align-items: center; }
        .title { font-size: 15px; font-weight: 500; }
        .badge { font-size: 10px; color: var(--muted); background: rgba(255,255,255,0.05); padding: 3px 6px; border-radius: 4px; text-transform: uppercase; }
        
        audio { width: 100%; height: 32px; filter: invert(1) grayscale(1) contrast(1.2); opacity: 0.85; }
        .no-result { text-align: center; color: var(--muted); padding: 30px; display: none; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Kozl Music</h1>
            <p>Minimalist Audio Space</p>
        </header>

        <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="search" placeholder="Tìm kiếm bài hát..." oninput="render()">
        </div>

        <div class="playlist" id="list"></div>
        <div class="no-result" id="empty">Không tìm thấy bài hát.</div>
    </div>

    <script>
        // 📌 DANH SÁCH BÀI HÁT: Sau này có bài mới, bạn chỉ cần tải file vào thư mục music và thêm 1 dòng vào đây
        const tracks = [
            { name: "Dakey", src: "music/dakey.mp3" },
            { name: "Bloodstained Rose", src: "music/BLOODSTAINED-ROSE.mp3" }
        ];

        const listEl = document.getElementById('list');
        const searchEl = document.getElementById('search');
        const emptyEl = document.getElementById('empty');

        function render() {
            const keyword = searchEl.value.toLowerCase().trim();
            const filtered = tracks.filter(t => t.name.toLowerCase().includes(keyword));
            
            listEl.innerHTML = filtered.map((t) => `
                <div class="card">
                    <div class="info">
                        <span class="title">${t.name}</span>
                        <span class="badge">Track ${String(tracks.indexOf(t) + 1).padStart(2, '0')}</span>
                    </div>
                    <audio controls preload="none">
                        <source src="${t.src}" type="audio/mpeg">
                    </audio>
                </div>
            `).join('');

            emptyEl.style.display = filtered.length === 0 ? "block" : "none";
        }

        render();
    </script>
</body>
</html>
