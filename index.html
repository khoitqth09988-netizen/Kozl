<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Music Player - Dakey</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .player-card {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 350px;
            text-align: center;
        }
        .logo-container {
            margin-bottom: 15px;
        }
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff7b00;
            box-shadow: 0 0 15px rgba(255, 123, 0, 0.5);
        }
        .song-info h2 {
            font-size: 20px;
            margin-bottom: 5px;
            color: #fff;
        }
        .song-info p {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
        }
        audio {
            width: 100%;
            outline: none;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .playlist {
            list-style: none;
            text-align: left;
        }
        .playlist li {
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .playlist li:hover {
            background: rgba(255, 123, 0, 0.3);
            transform: translateY(-2px);
        }
        .playlist li.active {
            background: #ff7b00;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <!-- Logo của bạn (Nhớ đặt file logo.png cùng thư mục) -->
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="logo" onerror="this.src='https://via.placeholder.com/90?text=Music'">
        </div>

        <!-- Thông tin bài hát -->
        <div class="song-info">
            <h2 id="current-title">Đang chọn bài hát</h2>
            <p id="current-artist">GitHub Music Player</p>
        </div>

        <!-- Trình phát nhạc Audio HTML5 -->
        <audio id="audio-player" controls>
            Trình duyệt của bạn không hỗ trợ thẻ audio.
        </audio>

        <!-- Danh sách bài hát (Đã gắn Direct Link chuẩn của bạn) -->
        <ul class="playlist">
            <li onclick="playSong('https://drive.google.com/uc?id=1WUdGlCPYC7gmNH-STlZpbcRRD9OHCqLJ', 'Dakey', 'Nghệ Sĩ', this)">
                <span>▶ Dakey</span>
                <span>🎵</span>
            </li>
        </ul>
    </div>

    <script>
        const audioPlayer = document.getElementById('audio-player');
        const currentTitle = document.getElementById('current-title');
        const currentArtist = document.getElementById('current-artist');

        function playSong(url, title, artist, element) {
            if (audioPlayer.src !== url) {
                audioPlayer.src = url;
                currentTitle.innerText = title;
                currentArtist.innerText = artist;

                document.querySelectorAll('.playlist li').forEach(li => li.classList.remove('active'));
                if (element) {
                    element.classList.add('active');
                }
            }
            
            audioPlayer.play().catch(error => {
                console.log("Trình duyệt đang chờ tương tác hoặc lỗi:", error);
            });
        }
    </script>

</body>
</html>
